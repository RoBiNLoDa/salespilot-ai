<div class="content-card">
    <mat-card class="card-table" appearance="outlined">
        <mat-card-content>
            <table mat-table [dataSource]="items()" class="mat-elevation-z8">

                <ng-container matColumnDef="product">
                    <th mat-header-cell *matHeaderCellDef>Producto</th>
                    <td mat-cell *matCellDef="let quoteItem">
                        {{ quoteItem.productId }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="quantity">
                    <th mat-header-cell *matHeaderCellDef>Cantidad</th>
                    <td mat-cell *matCellDef="let quoteItem">
                        {{ quoteItem.quantity }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="unitPrice">
                    <th mat-header-cell *matHeaderCellDef>Precio</th>
                    <td mat-cell *matCellDef="let quoteItem">
                        {{ quoteItem.unitPrice }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="discount">
                    <th mat-header-cell *matHeaderCellDef>Descuento</th>
                    <td mat-cell *matCellDef="let quoteItem">
                        {{ quoteItem.discount }}
                    </td>
                </ng-container>

                <ng-container matColumnDef="subtotal">
                    <th mat-header-cell *matHeaderCellDef>Total</th>
                    <td mat-cell *matCellDef="let quoteItem">
                        {{ quoteItem.unitPrice * quoteItem.quantity }}
                    </td>
                </ng-container>


                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef></th>

                    <td mat-cell *matCellDef="let quoteItem">

                        <button mat-icon-button (click)="edit.emit(quoteItem)">

                            <mat-icon>edit</mat-icon>

                        </button>

                        <button mat-icon-button (click)="delete.emit(quoteItem)">

                            <mat-icon>delete</mat-icon>

                        </button>

                    </td>

                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

            </table>
        </mat-card-content>
    </mat-card>

</div>
