<app-quote-header
    [quote]="quote()!"
    (edit)="editQuote()"
    (addItem)="openAddItemDialog()"
    (changeStatus)="changeStatus()">
</app-quote-header>

<app-quote-item-table
    [items]="quote()?.items ?? []"
    (edit)="editItem($event)"
    (delete)="deleteItem($event)">
</app-quote-item-table>
